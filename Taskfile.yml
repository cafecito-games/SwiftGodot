version: "3"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  godot:dump-api:
    desc: Dump Godot extension_api.json with docs from the local Godot binary
    silent: true
    env:
      GODOT_BIN: '{{.GODOT_BIN | default "godot"}}'
      OUTPUT: '{{.OUTPUT | default "Sources/ExtensionApi/extension_api.json"}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        godot_bin="$GODOT_BIN"
        if resolved=$(command -v "$godot_bin" 2>/dev/null); then
          godot_bin="$resolved"
        fi

        tmp_dir=$(mktemp -d)
        trap 'rm -rf "$tmp_dir"' EXIT

        (
          cd "$tmp_dir"
          "$godot_bin" --headless --dump-extension-api-with-docs
        )

        mkdir -p "$(dirname "$OUTPUT")"
        cp "$tmp_dir/extension_api.json" "$OUTPUT"
        jq '.header' "$OUTPUT"
        BASH

  godot:dump-interface:
    desc: Dump gdextension_interface.h from the local Godot binary
    silent: true
    env:
      GODOT_BIN: '{{.GODOT_BIN | default "godot"}}'
      OUTPUT: '{{.OUTPUT | default "Sources/GDExtension/include/gdextension_interface.h"}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        godot_bin="$GODOT_BIN"
        if resolved=$(command -v "$godot_bin" 2>/dev/null); then
          godot_bin="$resolved"
        fi

        tmp_dir=$(mktemp -d)
        trap 'rm -rf "$tmp_dir"' EXIT

        (
          cd "$tmp_dir"
          "$godot_bin" --headless --dump-gdextension-interface
        )

        mkdir -p "$(dirname "$OUTPUT")"
        cp "$tmp_dir/gdextension_interface.h" "$OUTPUT"
        head -5 "$OUTPUT"
        BASH

  godot:update-api:
    desc: Update extension_api.json and gdextension_interface.h from the local Godot binary
    silent: true
    cmds:
      - task godot:dump-api GODOT_BIN='{{.GODOT_BIN | default "godot"}}'
      - task godot:dump-interface GODOT_BIN='{{.GODOT_BIN | default "godot"}}'

  godot:show-api-version:
    desc: Print the Godot API version currently checked in
    silent: true
    cmds:
      - |
        jq -r '
          .header
          | "Godot \(.version_major).\(.version_minor).\(.version_patch) \(.version_status).\(.version_build) - \(.version_full_name)"
        ' Sources/ExtensionApi/extension_api.json

  custom-godot:version:
    desc: Print the version of the local custom Godot editor build
    silent: true
    env:
      CUSTOM_GODOT_BIN: '{{.CUSTOM_GODOT_BIN | default "/Users/christian/custom-godot/godot/bin/godot.macos.editor.arm64"}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        if [[ ! -x "$CUSTOM_GODOT_BIN" ]]; then
          echo "Expected executable custom Godot binary: $CUSTOM_GODOT_BIN"
          exit 1
        fi

        "$CUSTOM_GODOT_BIN" --version
        BASH

  custom-godot:update-api:
    desc: Update API files from the local custom Godot editor build
    silent: true
    vars:
      CUSTOM_GODOT_BIN: '{{.CUSTOM_GODOT_BIN | default "/Users/christian/custom-godot/godot/bin/godot.macos.editor.arm64"}}'
    cmds:
      - task godot:dump-api GODOT_BIN='{{.CUSTOM_GODOT_BIN}}'
      - task godot:dump-interface GODOT_BIN='{{.CUSTOM_GODOT_BIN}}'

  codegen:check:
    desc: Run SwiftGodot code generation in a clean scratch build
    vars:
      SCRATCH_PATH: '{{.SCRATCH_PATH | default ".build/codegen-check"}}'
    cmds:
      - rm -rf '{{.SCRATCH_PATH}}'
      - swift build --target SwiftGodot --scratch-path '{{.SCRATCH_PATH}}' -Xswiftc -no-verify-emitted-module-interface

  custom-godot:check:
    desc: Update API from custom Godot and verify SwiftGodot code generation
    silent: true
    vars:
      CUSTOM_GODOT_BIN: '{{.CUSTOM_GODOT_BIN | default "/Users/christian/custom-godot/godot/bin/godot.macos.editor.arm64"}}'
      SCRATCH_PATH: '{{.SCRATCH_PATH | default ".build/custom-godot-codegen-check"}}'
    cmds:
      - task custom-godot:version CUSTOM_GODOT_BIN='{{.CUSTOM_GODOT_BIN}}'
      - task custom-godot:update-api CUSTOM_GODOT_BIN='{{.CUSTOM_GODOT_BIN}}'
      - task godot:show-api-version
      - task codegen:check SCRATCH_PATH='{{.SCRATCH_PATH}}'

  build:
    desc: Build SwiftGodot and tests
    cmds:
      - swift build --build-tests

  test:
    desc: Run Swift tests
    cmds:
      - swift test

  test:godot:
    desc: Run Godot-based tests; pass FILTER=SuiteName.testName to narrow
    env:
      SWIFTGODOT_TEST_FILTER: '{{.FILTER | default ""}}'
    cmds:
      - swift run SwiftGodotTestRunner

  test:release:
    desc: Run release workflow helper tests
    silent: true
    cmds:
      - scripts/test-release-versioning

  test:generator:
    desc: Run generator custom-API regression tests
    silent: true
    cmds:
      - scripts/test-generator-custom-api

  release:tag:
    desc: Compose and validate a release tag; set VERSION, CHANNEL, and PRERELEASE_NUMBER
    silent: true
    env:
      VERSION: '{{.VERSION | default ""}}'
      CHANNEL: '{{.CHANNEL | default "final"}}'
      PRERELEASE_NUMBER: '{{.PRERELEASE_NUMBER | default ""}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        if [[ -z "$VERSION" ]]; then
          echo "Set VERSION, for example: task release:tag VERSION=0.1.0"
          exit 1
        fi

        source scripts/release-versioning

        godot_version=$(sg_release_godot_version)
        swift_tools_version=$(sg_release_swift_tools_version)
        tag=$(sg_release_compose_tag "$VERSION" "$CHANNEL" "$PRERELEASE_NUMBER" "$godot_version" "$swift_tools_version")
        sg_release_validate_tag "$tag" "$godot_version" "$swift_tools_version"

        printf '%s\n' "$tag"
        BASH
