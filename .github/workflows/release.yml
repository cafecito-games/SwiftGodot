name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 0.1.0
        required: true
        type: string
      commit:
        description: Commit SHA to release. Defaults to the workflow ref.
        required: false
        type: string
      release_notes:
        description: Release notes for the GitHub release.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error title=Missing secret::Set SWIFT_GODOT_RELEASE_TOKEN to a token with Contents read/write access to cafecito-games/SwiftGodot and cafecito-games/SwiftGodotBinary."
            exit 1
          fi

      - name: Prepare release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then
            echo "::error title=Invalid tag::Use 0.xx.yy style tags instead of v-prefixed tags."
            exit 1
          fi

          if [[ -z "$RELEASE_COMMIT" ]]; then
            RELEASE_COMMIT="$GITHUB_SHA"
          fi

          git rev-parse --verify "$RELEASE_COMMIT^{commit}" >/dev/null

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::A GitHub release already exists for $RELEASE_TAG."
            exit 1
          fi

          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Source tag exists::SwiftGodot already has tag $RELEASE_TAG."
            exit 1
          fi

          if git ls-remote --exit-code --tags "https://x-access-token:${RELEASE_TOKEN}@github.com/cafecito-games/SwiftGodotBinary.git" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Binary tag exists::SwiftGodotBinary already has tag $RELEASE_TAG."
            exit 1
          fi

          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  build-x86-ios:
    name: Build macOS x86_64 and iOS
    needs: prepare
    runs-on: macos-26-intel

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Build macOS x86_64
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          mkdir -p "$DERIVED_DATA" "$ARCHIVE_PATH"
          xcodebuild \
            -scheme SwiftGodot \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH"

      - name: Build iOS
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          xcodebuild \
            -scheme SwiftGodot \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH"

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-x86-ios-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Debug/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Debug/SwiftGodot.swiftmodule \
            Build/Products/Debug-iphoneos/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Debug-iphoneos/SwiftGodot.swiftmodule

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-x86-ios-products
          path: ${{ runner.temp }}/swiftgodot-x86-ios-products.tgz
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build macOS arm64
    needs: prepare
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Build macOS arm64
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          mkdir -p "$DERIVED_DATA" "$ARCHIVE_PATH"
          xcodebuild \
            -scheme SwiftGodot \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE_PATH"

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-arm64-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Debug/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Debug/SwiftGodot.swiftmodule

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-arm64-products
          path: ${{ runner.temp }}/swiftgodot-arm64-products.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package and publish binary release
    needs:
      - prepare
      - build-x86-ios
      - build-arm64
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone SwiftGodotBinary
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/cafecito-games/SwiftGodotBinary.git" "$RUNNER_TEMP/SwiftGodotBinary"

      - name: Download release products
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-products

      - name: Stage release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/sg-builds/release/derived
        run: |
          mkdir -p "$DERIVED_DATA" "${DERIVED_DATA}_arm"
          tar -xzf "$RUNNER_TEMP/release-products/swiftgodot-x86-ios-products/swiftgodot-x86-ios-products.tgz" -C "$DERIVED_DATA"
          tar -xzf "$RUNNER_TEMP/release-products/swiftgodot-arm64-products/swiftgodot-arm64-products.tgz" -C "${DERIVED_DATA}_arm"

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Run release script
        env:
          GH_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
          SWIFT_GODOT_SOURCE_REPO: ${{ github.repository }}
          SWIFT_GODOT_BINARY_REPO: cafecito-games/SwiftGodotBinary
          SWIFT_GODOT_BINARY_REPO_DIR: ${{ runner.temp }}/SwiftGodotBinary
          SWIFT_GODOT_OUTPUT_DIR: ${{ runner.temp }}/sg-builds
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/sg-builds/release/derived
          SWIFT_GODOT_SKIP_BUILD: 1
        run: |
          scripts/release "${{ inputs.tag }}" "$RUNNER_TEMP/release-notes.md" "${{ needs.prepare.outputs.commit }}"
