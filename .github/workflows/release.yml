name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0 or 0.1.0
        required: true
        type: string
      commit:
        description: Commit SHA to release. Defaults to the workflow ref.
        required: false
        type: string
      release_notes:
        description: Release notes for the GitHub release.
        required: true
        type: string
      include_macos_x86:
        description: Also build a macOS x86_64 (Intel) slice.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SWIFT_GODOT_RELEASE_XCODE: "26.4.1"
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_SHA256: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error title=Missing secret::Set SWIFT_GODOT_RELEASE_TOKEN to a token with Contents read/write access to cafecito-games/SwiftGodot and cafecito-games/SwiftGodotBinary."
            exit 1
          fi

      - name: Prepare release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_COMMIT" ]]; then
            RELEASE_COMMIT="$GITHUB_SHA"
          fi

          git rev-parse --verify "$RELEASE_COMMIT^{commit}" >/dev/null

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::A GitHub release already exists for $RELEASE_TAG."
            exit 1
          fi

          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Source tag exists::SwiftGodot already has tag $RELEASE_TAG."
            exit 1
          fi

          if git ls-remote --exit-code --tags "https://x-access-token:${RELEASE_TOKEN}@github.com/cafecito-games/SwiftGodotBinary.git" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Binary tag exists::SwiftGodotBinary already has tag $RELEASE_TAG."
            exit 1
          fi

          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  stage-package:
    name: Stage generated sources
    needs: prepare
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Stage generated-source distribution package
        env:
          SWIFT_GODOT_DESTINATION: platform=macOS,arch=arm64
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-stage-derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_GENERATION_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-stage-generation-derived
          SWIFT_GODOT_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-package
          SWIFT_GODOT_ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-stage-archive
          SWIFT_GODOT_STAGE_ONLY: 1
        run: |
          scripts/build-distribution-products

      - name: Pack generated-source distribution package
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-distribution-package.tgz" -C "$RUNNER_TEMP" swiftgodot-distribution-package

      - name: Upload generated-source distribution package
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-distribution-package
          path: ${{ runner.temp }}/swiftgodot-distribution-package.tgz
          if-no-files-found: error
          retention-days: 1

  build-x86:
    name: Build macOS x86_64
    needs:
      - prepare
      - stage-package
    runs-on: macos-26
    if: ${{ inputs.include_macos_x86 }}

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Download generated-source distribution package
        uses: actions/download-artifact@v4
        with:
          name: swiftgodot-distribution-package
          path: ${{ runner.temp }}

      - name: Extract generated-source distribution package
        run: |
          tar -xzf "$RUNNER_TEMP/swiftgodot-distribution-package.tgz" -C "$RUNNER_TEMP"

      - name: Build macOS x86_64 distribution products
        env:
          SWIFT_GODOT_DESTINATION: platform=macOS,arch=x86_64
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_PREPARED_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-package
          SWIFT_GODOT_GENERATION_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-generation-derived
          SWIFT_GODOT_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-build-package
          SWIFT_GODOT_ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          scripts/build-distribution-products

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-x86-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Release/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Release/PackageFrameworks/SwiftGodotEmbed.framework \
            Build/Products/Release/GDExtensionC.o \
            Build/Products/Release/SwiftGodot.swiftmodule \
            Build/Intermediates.noindex/GeneratedModuleMaps

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-x86-products
          path: ${{ runner.temp }}/swiftgodot-x86-products.tgz
          if-no-files-found: error
          retention-days: 1

  build-ios:
    name: Build iOS
    needs:
      - prepare
      - stage-package
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Download generated-source distribution package
        uses: actions/download-artifact@v4
        with:
          name: swiftgodot-distribution-package
          path: ${{ runner.temp }}

      - name: Extract generated-source distribution package
        run: |
          tar -xzf "$RUNNER_TEMP/swiftgodot-distribution-package.tgz" -C "$RUNNER_TEMP"

      - name: Build iOS distribution products
        env:
          SWIFT_GODOT_DESTINATION: generic/platform=iOS
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_PREPARED_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-package
          SWIFT_GODOT_GENERATION_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-generation-derived
          SWIFT_GODOT_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-build-package
          SWIFT_GODOT_ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          scripts/build-distribution-products

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-ios-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Release-iphoneos/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Release-iphoneos/PackageFrameworks/SwiftGodotEmbed.framework \
            Build/Products/Release-iphoneos/GDExtensionC.o \
            Build/Products/Release-iphoneos/SwiftGodot.swiftmodule \
            Build/Intermediates.noindex/GeneratedModuleMaps-iphoneos

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-ios-products
          path: ${{ runner.temp }}/swiftgodot-ios-products.tgz
          if-no-files-found: error
          retention-days: 1

  build-ios-simulator:
    name: Build iOS Simulator
    needs:
      - prepare
      - stage-package
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Download generated-source distribution package
        uses: actions/download-artifact@v4
        with:
          name: swiftgodot-distribution-package
          path: ${{ runner.temp }}

      - name: Extract generated-source distribution package
        run: |
          tar -xzf "$RUNNER_TEMP/swiftgodot-distribution-package.tgz" -C "$RUNNER_TEMP"

      - name: Build iOS Simulator distribution products
        env:
          SWIFT_GODOT_DESTINATION: generic/platform=iOS Simulator
          SWIFT_GODOT_ARCHS: arm64
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_PREPARED_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-package
          SWIFT_GODOT_GENERATION_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-generation-derived
          SWIFT_GODOT_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-build-package
          SWIFT_GODOT_ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          scripts/build-distribution-products

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-ios-simulator-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Release-iphonesimulator/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Release-iphonesimulator/PackageFrameworks/SwiftGodotEmbed.framework \
            Build/Products/Release-iphonesimulator/GDExtensionC.o \
            Build/Products/Release-iphonesimulator/SwiftGodot.swiftmodule \
            Build/Intermediates.noindex/GeneratedModuleMaps-iphonesimulator

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-ios-simulator-products
          path: ${{ runner.temp }}/swiftgodot-ios-simulator-products.tgz
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build macOS arm64
    needs:
      - prepare
      - stage-package
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Download generated-source distribution package
        uses: actions/download-artifact@v4
        with:
          name: swiftgodot-distribution-package
          path: ${{ runner.temp }}

      - name: Extract generated-source distribution package
        run: |
          tar -xzf "$RUNNER_TEMP/swiftgodot-distribution-package.tgz" -C "$RUNNER_TEMP"

      - name: Build macOS arm64 distribution products
        env:
          SWIFT_GODOT_DESTINATION: platform=macOS,arch=arm64
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_PREPARED_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-package
          SWIFT_GODOT_GENERATION_DERIVED_DATA: ${{ runner.temp }}/swiftgodot-generation-derived
          SWIFT_GODOT_RELEASE_PACKAGE_DIR: ${{ runner.temp }}/swiftgodot-distribution-build-package
          SWIFT_GODOT_ARCHIVE_PATH: ${{ runner.temp }}/swiftgodot-archive
        run: |
          scripts/build-distribution-products

      - name: Pack release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/swiftgodot-derived
        run: |
          tar -czf "$RUNNER_TEMP/swiftgodot-arm64-products.tgz" -C "$DERIVED_DATA" \
            Build/Products/Release/PackageFrameworks/SwiftGodot.framework \
            Build/Products/Release/PackageFrameworks/SwiftGodotEmbed.framework \
            Build/Products/Release/GDExtensionC.o \
            Build/Products/Release/SwiftGodot.swiftmodule \
            Build/Intermediates.noindex/GeneratedModuleMaps

      - name: Upload release products
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-arm64-products
          path: ${{ runner.temp }}/swiftgodot-arm64-products.tgz
          if-no-files-found: error
          retention-days: 1

  stage-android-package:
    name: Stage Android SwiftGodot package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # The Ubuntu runner image does not ship the Swift release signing keys
      # that setup-swift needs to verify its Swiftly download.
      - name: Import Swift signing keys
        run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

      - name: Set up Swift 6.3.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      # Generation depends only on the Godot extension API and the generator, so
      # a hit skips a full host build of SwiftGodot.
      - name: Restore generated Swift sources
        uses: actions/cache@v4
        with:
          path: .build/android-generated-sources
          key: android-generated-sources-${{ runner.os }}-swift6.3.3-${{ hashFiles('Sources/ExtensionApi/**', 'Generator/**', 'Plugins/CodeGeneratorPlugin/**', 'Package.swift') }}

      # Binding generation is host-only and ABI independent, so every ABI job
      # reuses this one staged package instead of regenerating it.
      - name: Stage Android package
        env:
          SWIFT_GODOT_GENERATED_SOURCES_CACHE: ${{ github.workspace }}/.build/android-generated-sources
        run: scripts/generate-android-package .build/android-staged-package

      - name: Upload staged Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-staged-package
          path: .build/android-staged-package
          if-no-files-found: error
          retention-days: 1

  build-android-abi:
    name: Build Android ${{ matrix.abi }}
    needs:
      - prepare
      - stage-android-package
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    env:
      SWIFT_GODOT_ANDROID_ABIS: ${{ matrix.abi }}

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # The Ubuntu runner image does not ship the Swift release signing keys
      # that setup-swift needs to verify its Swiftly download.
      - name: Import Swift signing keys
        run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

      - name: Set up Swift 6.3.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android toolchain
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          swift sdk install "$SWIFT_ANDROID_SDK_URL" --checksum "$SWIFT_ANDROID_SDK_SHA256"
          sdk_root=$(find "$HOME" -type d -path '*/swift-6.3.3-RELEASE_android.artifactbundle/swift-android' -print -quit)
          test -n "$sdk_root"
          echo "SWIFT_GODOT_ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" "$sdk_root/scripts/setup-android-sdk.sh"

      - name: Download staged Android package
        uses: actions/download-artifact@v4
        with:
          name: android-staged-package
          path: .build/android-staged-package

      - name: Build and validate ${{ matrix.abi }}
        env:
          SWIFT_GODOT_ANDROID_PACKAGE: ${{ github.workspace }}/.build/android-staged-package
        run: |
          scripts/build-android-libraries .build/android
          scripts/build-android-test-extension .build/android-test

      # Each ABI uploads only its own subtree, so the aggregation job can detect
      # any file two ABI jobs both claim.
      - name: Collect ${{ matrix.abi }} artifacts
        run: |
          mkdir -p .build/android-upload
          cp -R .build/android/jni .build/android-upload/runtime-jni
          cp -R .build/android-test/jni .build/android-upload/consumer-jni

      - name: Upload ${{ matrix.abi }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-abi-${{ matrix.abi }}
          path: .build/android-upload
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Package Android arm64-v8a and x86_64
    needs:
      - prepare
      - build-android-abi
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install pinned Android NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Download per-ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-abi-*
          path: .build/android-abis

      - name: Create custom Godot access token
        id: custom-godot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CAFECITO_CI_BOT_APP_ID }}
          private-key: ${{ secrets.CAFECITO_CI_BOT_PRIVATE_KEY }}
          owner: cafecito-games
          repositories: custom-godot
          permission-contents: read

      - name: Build and validate publishable Android AAR
        env:
          GH_TOKEN: ${{ steps.custom-godot-token.outputs.token }}
        run: |
          scripts/aggregate-android-jni .build/android/jni .build/android-abis/*/runtime-jni
          scripts/aggregate-android-jni .build/android-test/jni .build/android-abis/*/consumer-jni
          scripts/validate-android-elf .build/android/jni
          scripts/package-android-aar .build/android/jni .build/android-aar
          scripts/package-android-test-aar .build/android-test/jni .build/android-test
          scripts/reclaim-android-build-space
          SWIFT_GODOT_ANDROID_EXPORT_ONLY=1 scripts/test-android-runtime x86_64

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftgodot-android
          path: .build/android-aar/SwiftGodot-release.aar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package and publish binary release
    needs:
      - prepare
      - build-x86
      - build-ios
      - build-ios-simulator
      - build-arm64
      - build-android
    runs-on: macos-26
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && needs.build-ios.result == 'success'
      && needs.build-ios-simulator.result == 'success'
      && needs.build-arm64.result == 'success'
      && needs.build-android.result == 'success'
      && (needs.build-x86.result == 'success' || needs.build-x86.result == 'skipped') }}

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.SWIFT_GODOT_RELEASE_XCODE }}"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone SwiftGodotBinary
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/cafecito-games/SwiftGodotBinary.git" "$RUNNER_TEMP/SwiftGodotBinary"

      - name: Download release products
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-products

      - name: Stage release products
        env:
          DERIVED_DATA: ${{ runner.temp }}/sg-builds/release/derived
        run: |
          # The arm64-macOS, iOS-device, and iOS-simulator tarballs all extract
          # into the same DERIVED_DATA. This is safe only because each job packs
          # SDK-suffixed, disjoint top-level paths (Release / Release-iphoneos /
          # Release-iphonesimulator and their matching GeneratedModuleMaps dirs).
          # The optional macOS x86_64 products extract into a separate
          # ${DERIVED_DATA}_x86 sidecar. Keep that invariant if you change what
          # any build job packs.
          mkdir -p "$DERIVED_DATA"
          tar -xzf "$RUNNER_TEMP/release-products/swiftgodot-arm64-products/swiftgodot-arm64-products.tgz" -C "$DERIVED_DATA"
          tar -xzf "$RUNNER_TEMP/release-products/swiftgodot-ios-products/swiftgodot-ios-products.tgz" -C "$DERIVED_DATA"
          tar -xzf "$RUNNER_TEMP/release-products/swiftgodot-ios-simulator-products/swiftgodot-ios-simulator-products.tgz" -C "$DERIVED_DATA"
          x86_tarball="$RUNNER_TEMP/release-products/swiftgodot-x86-products/swiftgodot-x86-products.tgz"
          if [[ -f "$x86_tarball" ]]; then
            mkdir -p "${DERIVED_DATA}_x86"
            tar -xzf "$x86_tarball" -C "${DERIVED_DATA}_x86"
          fi

      - name: Prepare release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Run release script
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFT_GODOT_SOURCE_REPO: ${{ github.repository }}
          SWIFT_GODOT_BINARY_REPO: cafecito-games/SwiftGodotBinary
          SWIFT_GODOT_BINARY_REPO_DIR: ${{ runner.temp }}/SwiftGodotBinary
          SWIFT_GODOT_OUTPUT_DIR: ${{ runner.temp }}/sg-builds
          SWIFT_GODOT_DERIVED_DATA: ${{ runner.temp }}/sg-builds/release/derived
          SWIFT_GODOT_CONFIGURATION: Release
          SWIFT_GODOT_SKIP_BUILD: 1
          SWIFT_GODOT_INCLUDE_MACOS_X86: ${{ inputs.include_macos_x86 && '1' || '' }}
          SWIFT_GODOT_ANDROID_AAR: ${{ runner.temp }}/release-products/swiftgodot-android/SwiftGodot-release.aar
        run: |
          scripts/release "${{ inputs.tag }}" "$RUNNER_TEMP/release-notes.md" "${{ needs.prepare.outputs.commit }}"
