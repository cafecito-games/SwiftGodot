name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example 0.1.0
        required: true
        type: string
      commit:
        description: Commit SHA to release. Defaults to the workflow ref.
        required: false
        type: string
      release_notes:
        description: Release notes for the GitHub release.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish binary release
    runs-on: macos-26

    steps:
      - name: Checkout SwiftGodot
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release token
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error title=Missing secret::Set SWIFT_GODOT_RELEASE_TOKEN to a token with Contents read/write access to cafecito-games/SwiftGodot and cafecito-games/SwiftGodotBinary."
            exit 1
          fi

      - name: Clone SwiftGodotBinary
        env:
          RELEASE_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/cafecito-games/SwiftGodotBinary.git" "$RUNNER_TEMP/SwiftGodotBinary"

      - name: Prepare release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then
            echo "::error title=Invalid tag::Use 0.xx.yy style tags instead of v-prefixed tags."
            exit 1
          fi

          if [[ -z "$RELEASE_COMMIT" ]]; then
            RELEASE_COMMIT="$GITHUB_SHA"
          fi

          git rev-parse --verify "$RELEASE_COMMIT^{commit}" >/dev/null

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::A GitHub release already exists for $RELEASE_TAG."
            exit 1
          fi

          if git -C "$RUNNER_TEMP/SwiftGodotBinary" rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Binary tag exists::SwiftGodotBinary already has tag $RELEASE_TAG."
            exit 1
          fi

          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Run release script
        env:
          GH_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
          SWIFT_GODOT_SOURCE_REPO: ${{ github.repository }}
          SWIFT_GODOT_BINARY_REPO: cafecito-games/SwiftGodotBinary
          SWIFT_GODOT_BINARY_REPO_DIR: ${{ runner.temp }}/SwiftGodotBinary
          SWIFT_GODOT_OUTPUT_DIR: ${{ runner.temp }}/sg-builds
        run: |
          scripts/release "${{ inputs.tag }}" "${{ steps.release.outputs.notes }}" "${{ steps.release.outputs.commit }}"
