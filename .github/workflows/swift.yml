# This workflow will build a Swift project and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE_TAG: v4.7.2-20260826.1
  GODOT_EDITOR_SHA256: 6e9945ad00d7c6877f1c3a98224c17c5ff0caf8cf42b716e9152569f6b2ac71e
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_SHA256: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5

jobs:
  build-and-test-macos:
    runs-on: blacksmith-6vcpu-macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "latest-stable"

    - name: Create custom Godot access token
      id: custom-godot-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.CAFECITO_CI_BOT_APP_ID }}
        private-key: ${{ secrets.CAFECITO_CI_BOT_PRIVATE_KEY }}
        owner: cafecito-games
        repositories: custom-godot
        permission-contents: read

    - name: Install ripgrep
      run: brew install ripgrep

    - name: Install custom Godot
      env:
        GH_TOKEN: ${{ steps.custom-godot-token.outputs.token }}
      run: |
        test "$(uname -m)" = arm64

        archive="$RUNNER_TEMP/godot_macos_editor.arm64.zip"
        install_dir="$RUNNER_TEMP/custom-godot"
        bin_dir="$RUNNER_TEMP/custom-godot-bin"

        gh release download "$GODOT_RELEASE_TAG" \
          --repo cafecito-games/custom-godot \
          --pattern godot_macos_editor.arm64.zip \
          --dir "$RUNNER_TEMP"
        echo "$GODOT_EDITOR_SHA256  $archive" | shasum -a 256 --check

        mkdir -p "$install_dir" "$bin_dir"
        unzip -q "$archive" -d "$install_dir"
        ln -s "$install_dir/godot_macos_editor.app/Contents/MacOS/Godot" "$bin_dir/godot"
        echo "$bin_dir" >> "$GITHUB_PATH"

        export PATH="$bin_dir:$PATH"
        godot --version
        test "$(godot --version)" = "4.7.2.stable.cafecito_dc0a505af.ed1daf0bf"

    - name: Show ripgrep version
      run: |
        rg --version

    - name: Build
      run: swift build --build-tests --quiet

    - name: Run Swift tests (Swift Testing)
      run: swift test --skip-build --no-parallel --disable-xctest

    - name: Run Swift tests (XCTest)
      run: swift test --skip-build --no-parallel --disable-swift-testing

    - name: Run Godot-based tests
      run: swift run SwiftGodotTestRunner

    - name: Run release script regression tests
      run: |
        scripts/test-make-swiftgodot-framework
        scripts/test-release-build-configuration
        scripts/test-binary-manifest
        scripts/test-package-resolution
        scripts/test-distribution-package-staging
        scripts/test-android-ci-topology
        scripts/test-package-godot-addon
        scripts/test-release-toolchain

    - name: Build macro artifact bundle (exercise release script)
      env:
        SWIFT_GODOT_INCLUDE_MACOS_X86: 1
      run: scripts/build-macro-artifactbundle "$RUNNER_TEMP/sg-macro-artifact" "0.0.0-ci"

  android-scripts:
    name: Android script regression tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep

    - name: Install pinned Android NDK
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

    - name: Run Android script regression tests
      run: |
        scripts/test-android-portability
        scripts/test-stage-android-package
        scripts/test-build-android-libraries
        scripts/test-aggregate-android-jni
        scripts/test-validate-android-elf
        scripts/test-package-android-aar
        scripts/test-build-android-test-extension
        scripts/test-android-runtime-harness
        scripts/test-reclaim-android-build-space
        scripts/test-configure-android-emulator

  android-stage:
    name: Stage Android SwiftGodot package
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # The Blacksmith Ubuntu image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    # Generation depends only on the Godot extension API and the generator, so a
    # hit skips a full host build of SwiftGodot.
    - name: Restore generated Swift sources
      uses: actions/cache@v4
      with:
        path: .build/android-generated-sources
        key: android-generated-sources-${{ runner.os }}-swift6.3.3-${{ hashFiles('Sources/ExtensionApi/**', 'Generator/**', 'Plugins/CodeGeneratorPlugin/**', 'Package.swift') }}

    # Binding generation is host-only and ABI independent, so every ABI job
    # reuses this one staged package instead of regenerating it.
    - name: Stage Android package
      env:
        SWIFT_GODOT_GENERATED_SOURCES_CACHE: ${{ github.workspace }}/.build/android-generated-sources
      run: scripts/generate-android-package .build/android-staged-package

    - name: Upload staged Android package
      uses: actions/upload-artifact@v4
      with:
        name: android-staged-package
        path: .build/android-staged-package
        if-no-files-found: error
        retention-days: 1

  android-abi:
    name: Android ${{ matrix.abi }} libraries
    needs: android-stage
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    env:
      SWIFT_GODOT_ANDROID_ABIS: ${{ matrix.abi }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # The Blacksmith Ubuntu image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install pinned Android toolchain
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
        swift sdk install "$SWIFT_ANDROID_SDK_URL" --checksum "$SWIFT_ANDROID_SDK_SHA256"
        sdk_root=$(find "$HOME" -type d -path '*/swift-6.3.3-RELEASE_android.artifactbundle/swift-android' -print -quit)
        test -n "$sdk_root"
        echo "SWIFT_GODOT_ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
        ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" "$sdk_root/scripts/setup-android-sdk.sh"

    - name: Download staged Android package
      uses: actions/download-artifact@v4
      with:
        name: android-staged-package
        path: .build/android-staged-package

    - name: Build and validate ${{ matrix.abi }}
      env:
        SWIFT_GODOT_ANDROID_PACKAGE: ${{ github.workspace }}/.build/android-staged-package
      run: |
        scripts/build-android-libraries .build/android
        scripts/build-android-test-extension .build/android-test

    # Each ABI uploads only its own subtree, so the aggregation job can detect
    # any file two ABI jobs both claim.
    - name: Collect ${{ matrix.abi }} artifacts
      run: |
        mkdir -p .build/android-upload
        cp -R .build/android/jni .build/android-upload/runtime-jni
        cp -R .build/android-test/jni .build/android-upload/consumer-jni

    - name: Upload ${{ matrix.abi }} artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-abi-${{ matrix.abi }}
        path: .build/android-upload
        if-no-files-found: error
        retention-days: 1

  android-package:
    name: Android AAR packaging and x86_64 runtime
    needs: android-abi
    # Stays on a GitHub runner: the emulator smoke test needs /dev/kvm. This job
    # is Gradle and emulator bound, not compile bound, so it gains nothing from
    # the larger Blacksmith hosts the ABI builds use.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android build utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep

    - name: Install pinned Android NDK
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

    - name: Download per-ABI artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: android-abi-*
        path: .build/android-abis

    - name: Aggregate and validate both ABIs
      run: |
        scripts/aggregate-android-jni .build/android/jni .build/android-abis/*/runtime-jni
        scripts/aggregate-android-jni .build/android-test/jni .build/android-abis/*/consumer-jni
        scripts/validate-android-elf .build/android/jni

    - name: Package and validate Android AARs
      run: |
        scripts/package-android-aar .build/android/jni .build/android-aar
        scripts/package-android-test-aar .build/android-test/jni .build/android-test

    - name: Reclaim build space for Android emulator
      run: scripts/reclaim-android-build-space

    - name: Create custom Godot access token
      id: custom-godot-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.CAFECITO_CI_BOT_APP_ID }}
        private-key: ${{ secrets.CAFECITO_CI_BOT_PRIVATE_KEY }}
        owner: cafecito-games
        repositories: custom-godot
        permission-contents: read

    # The runner exposes /dev/kvm but only to the kvm group, so the emulator
    # falls back to software emulation and never finishes booting.
    - name: Grant access to KVM
      run: |
        printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -w /dev/kvm

    - name: Run x86_64 Android emulator smoke test
      uses: reactivecircus/android-emulator-runner@v2
      env:
        GH_TOKEN: ${{ steps.custom-godot-token.outputs.token }}
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_6
        # The action appends rather than replaces the profile's existing value,
        # so normalize it in the pre-launch hook before the emulator reads it.
        disk-size: 3G
        pre-emulator-launch-script: scripts/configure-android-emulator
        disable-animations: true
        script: scripts/test-android-runtime x86_64

    - name: Upload Android diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-diagnostics
        path: |
          .build/android-aar/SwiftGodot-release.aar
          .build/android-test/SwiftGodotAndroidTest-release.aar
          .build/android-runtime-x86_64/project/build/SwiftGodotAndroidTest.apk
        if-no-files-found: warn
