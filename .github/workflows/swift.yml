# This workflow will build a Swift project and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_ANDROID_SDK_URL: https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz
  SWIFT_ANDROID_SDK_SHA256: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      swift_host: ${{ steps.filter.outputs.swift_host }}
      macros: ${{ steps.filter.outputs.macros }}
      release_scripts: ${{ steps.filter.outputs.release_scripts }}
      android_scripts: ${{ steps.filter.outputs.android_scripts }}
      android: ${{ steps.filter.outputs.android }}

    steps:
    - name: Classify pull request changes
      id: filter
      if: ${{ github.event_name == 'pull_request' }}
      uses: dorny/paths-filter@v3
      with:
        filters: |
          swift_host:
            - 'Package.swift'
            - 'Package.resolved'
            - 'Sources/**'
            - '!Sources/SwiftGodot/SwiftGodot.docc/**'
            - 'Generator/**'
            - 'Plugins/**'
            - 'Tests/SwiftGodotUniversalTests/**'
            - 'Tests/SwiftGodotTestExtension/**'
            - 'Tests/SwiftGodotTestProject/**'
            - 'config/godot-fork.json'
            - 'scripts/godot-fork-pin'
            - 'scripts/build-gdextension-shim'
            - 'scripts/gdextension-shim-config'
            - 'scripts/install-zig'
            - 'scripts/package-godot-addon'
            - 'scripts/restore-git-mtimes'
            - '.github/workflows/swift.yml'
          macros:
            - 'Package.swift'
            - 'Package.resolved'
            - 'Sources/SwiftGodotMacroLibrary/**'
            - 'Tests/SwiftGodotMacrosTests/**'
            - 'scripts/restore-git-mtimes'
            - '.github/workflows/swift.yml'
          release_scripts:
            - 'scripts/**'
            - 'Makefile'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Package.distribution.swift'
            - 'Package.android.swift'
            - 'Sources/SwiftGodotEmbed/**'
            - 'Sources/SwiftGodotMacroLibrary/**'
            - 'config/godot-fork.json'
            - '.github/workflows/**'
          android_scripts:
            - 'Android/**'
            - 'Package.swift'
            - 'Package.android.swift'
            - 'Sources/AndroidTestExtension/**'
            - 'Tests/AndroidTestProject/**'
            - 'scripts/*android*'
            - 'scripts/godot-fork-pin'
            - 'config/godot-fork.json'
            - '.github/workflows/swift.yml'
            - '.github/workflows/release.yml'
          android:
            - 'Android/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Package.android.swift'
            - 'Sources/SwiftGodot/**'
            - '!Sources/SwiftGodot/SwiftGodot.docc/**'
            - 'Sources/GDExtension/**'
            - 'Sources/SwiftGodotEmbed/**'
            - 'Sources/SwiftGodotMacroLibrary/**'
            - 'Sources/AndroidTestExtension/**'
            - 'Sources/ExtensionApi/**'
            - 'Generator/**'
            - 'Plugins/CodeGeneratorPlugin/**'
            - 'Tests/AndroidTestProject/**'
            - 'config/godot-fork.json'
            - 'scripts/*android*'
            - 'scripts/godot-fork-pin'
            - 'scripts/restore-git-mtimes'
            - '.github/workflows/swift.yml'

  build-and-test-macos:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.swift_host == 'true' }}
    runs-on: macos-26
    env:
      SWIFTGODOT_TEST_SCOPE: universal

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Restore git mtimes for incremental builds
      run: scripts/restore-git-mtimes

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "latest-stable"

    - name: Restore SwiftPM build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: swift-build-macos-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}
        restore-keys: |
          swift-build-macos-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-

    - name: Load the pinned Cafecito Godot release
      run: scripts/godot-fork-pin --github-env >> "$GITHUB_ENV"

    - name: Restore Cafecito Godot archive cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/godot-cache
        key: godot-editor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/godot-fork.json') }}

    - name: Install Cafecito Godot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$(uname -m)" = arm64

        cache_dir="$RUNNER_TEMP/godot-cache"
        archive="$cache_dir/godot_macos_editor.arm64.zip"
        install_dir="$RUNNER_TEMP/godot-fork"
        bin_dir="$RUNNER_TEMP/godot-fork-bin"

        mkdir -p "$cache_dir"
        if [[ ! -f "$archive" ]]; then
          gh release download "$GODOT_RELEASE_TAG" \
            --repo "$GODOT_REPOSITORY" \
            --pattern godot_macos_editor.arm64.zip \
            --dir "$cache_dir"
        fi
        echo "$GODOT_EDITOR_SHA256  $archive" | shasum -a 256 --check

        mkdir -p "$install_dir" "$bin_dir"
        unzip -q "$archive" -d "$install_dir"
        ln -s "$install_dir/godot_macos_editor.app/Contents/MacOS/Godot" "$bin_dir/godot"
        echo "$bin_dir" >> "$GITHUB_PATH"

        export PATH="$bin_dir:$PATH"
        godot --version
        test "$(godot --version)" = "$GODOT_VERSION_STRING"

    - name: Build
      run: |
        swift build --product SwiftGodotPackageTests --quiet
        swift build --product SwiftGodot --quiet
        swift build --product SwiftGodotTestExtension --quiet
        swift build --product SwiftGodotTestRunner --quiet

    - name: Save SwiftPM build cache
      if: ${{ steps.build-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.build-cache.outputs.cache-matched-key == '') }}
      uses: actions/cache/save@v4
      with:
        path: .build
        key: swift-build-macos-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}

    - name: Run Swift tests
      run: swift test --skip-build --no-parallel

    - name: Run Godot-based tests
      run: .build/debug/SwiftGodotTestRunner --skip-build

  macro-tests:
    name: Macro expansion tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.macros == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SWIFTGODOT_TEST_SCOPE: macros

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Restore git mtimes for incremental builds
      run: scripts/restore-git-mtimes

    # The Ubuntu runner image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    - name: Restore macro build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: swift-build-macros-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
        restore-keys: |
          swift-build-macros-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift') }}-

    - name: Build and run macro tests
      run: |
        swift build --product SwiftGodotPackageTests --quiet
        swift test --skip-build --no-parallel

    - name: Save macro build cache
      if: ${{ steps.build-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.build-cache.outputs.cache-matched-key == '') }}
      uses: actions/cache/save@v4
      with:
        path: .build
        key: swift-build-macros-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}

  release-script-tests:
    name: Release and packaging script tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.release_scripts == 'true' }}
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "latest-stable"

    - name: Install workflow validation tools
      run: brew install ripgrep actionlint

    - name: Show ripgrep version
      run: rg --version

    - name: Validate GitHub Actions workflows
      run: actionlint

    - name: Install pinned Zig
      run: |
        scripts/install-zig "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
        echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

    - name: Restore Zig cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/zig-cache
        key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gdextension-shim-config') }}

    # scripts/test-package-godot-addon runs the real packaging script, which cuts
    # the addon's gpm slices and validates them.
    - name: Install pinned gpm
      run: scripts/install-gpm "$RUNNER_TEMP/gpm" >> "$GITHUB_PATH"

    - name: Run release script regression tests
      run: |
        scripts/test-make-swiftgodot-framework
        scripts/test-release-build-configuration
        scripts/test-binary-manifest
        scripts/test-deferred-release-resume
        scripts/test-package-resolution
        scripts/test-distribution-package-staging
        scripts/test-android-ci-topology
        scripts/test-build-gdextension-shim
        scripts/test-package-godot-addon
        scripts/test-release-toolchain
        scripts/test-godot-fork-pin

  build-and-test-linux:
    name: Linux source build and runtime tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.swift_host == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWIFTGODOT_TEST_SCOPE: universal

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Restore git mtimes for incremental builds
      run: scripts/restore-git-mtimes

    # The Ubuntu runner image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    - name: Restore SwiftPM build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: swift-build-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}
        restore-keys: |
          swift-build-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-

    - name: Install Linux runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1

    - name: Load the pinned Cafecito Godot release
      run: scripts/godot-fork-pin --github-env >> "$GITHUB_ENV"

    - name: Restore Cafecito Godot archive cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/godot-cache
        key: godot-editor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/godot-fork.json') }}

    - name: Install Cafecito Godot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cache_dir="$RUNNER_TEMP/godot-cache"
        archive="$cache_dir/godot_linux_editor.x86_64.tar.gz"
        bin_dir="$RUNNER_TEMP/godot-fork-bin"

        mkdir -p "$cache_dir"
        if [[ ! -f "$archive" ]]; then
          gh release download "$GODOT_RELEASE_TAG" \
            --repo "$GODOT_REPOSITORY" \
            --pattern godot_linux_editor.x86_64.tar.gz \
            --dir "$cache_dir"
        fi
        echo "$GODOT_LINUX_EDITOR_SHA256  $archive" | sha256sum --check

        mkdir -p "$bin_dir"
        tar -xzf "$archive" -C "$bin_dir"
        mv "$bin_dir/godot.linuxbsd.editor.x86_64" "$bin_dir/godot"
        chmod +x "$bin_dir/godot"
        echo "$bin_dir" >> "$GITHUB_PATH"

        export PATH="$bin_dir:$PATH"
        godot --headless --version
        test "$(godot --headless --version 2>/dev/null)" = "$GODOT_VERSION_STRING"

    - name: Build
      run: |
        swift build --product SwiftGodotPackageTests --quiet
        swift build --product SwiftGodot --quiet
        swift build --product SwiftGodotTestExtension --quiet
        swift build --product SwiftGodotTestRunner --quiet

    - name: Save SwiftPM build cache
      if: ${{ steps.build-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.build-cache.outputs.cache-matched-key == '') }}
      uses: actions/cache/save@v4
      with:
        path: .build
        key: swift-build-linux-swift6.3.3-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}

    - name: Run Swift tests
      run: swift test --skip-build --no-parallel

    - name: Run Godot-based tests
      run: .build/debug/SwiftGodotTestRunner --skip-build

    - name: Install pinned Zig
      run: |
        scripts/install-zig "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
        echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

    - name: Restore Zig cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/zig-cache
        key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/gdextension-shim-config') }}

    # This is the platform where the defect reproduces: before the shim
    # shipped, a Linux host loading the addon printed "No GDExtension library
    # found" for an addon that was in fact working correctly.
    #
    # Godot exits 0 even when a .gdextension resolves no library for the host,
    # so the log is what this gate asserts; the exit status is only a secondary
    # check. The project needs a main scene — headless Godot refuses to run
    # without one and does not exit — and an import pass before the asserted
    # run, so first-run editor noise stays out of the log being checked.
    - name: Gate the addon's GDExtension load on Linux
      run: |
        shim_dir="$RUNNER_TEMP/gdextension-shim"
        project_dir="$RUNNER_TEMP/addon-load-gate"
        addon_dir="$project_dir/addons/SwiftGodot"

        scripts/build-gdextension-shim "$shim_dir"

        mkdir -p "$addon_dir/bin/linux_x86_64"
        cp "$shim_dir/linux_x86_64/libSwiftGodotEmbed.so" "$addon_dir/bin/linux_x86_64/"

        # The entry symbol and the linux.x86_64 library line are read out of the
        # packaging script's emitted text rather than retyped, so this gate
        # exercises what consumers actually install. [dependencies] is omitted:
        # it drives Apple export embedding and names no Linux payload.
        entry_symbol=$(sed -n 's/^entry_symbol = "\(.*\)"$/\1/p' scripts/package-godot-addon)
        library_line=$(grep '^linux\.x86_64 = ' scripts/package-godot-addon)
        test -n "$entry_symbol"
        test -n "$library_line"

        {
          echo '[configuration]'
          echo "entry_symbol = \"$entry_symbol\""
          echo 'compatibility_minimum = "4.7"'
          echo
          echo '[libraries]'
          echo "$library_line"
        } > "$addon_dir/SwiftGodotEmbed.gdextension"
        cat "$addon_dir/SwiftGodotEmbed.gdextension"

        printf '[gd_scene format=3]\n\n[node name="Main" type="Node"]\n' \
          > "$project_dir/main.tscn"
        printf 'config_version=5\n\n[application]\nconfig/name="SwiftGodot addon load gate"\nrun/main_scene="res://main.tscn"\n' \
          > "$project_dir/project.godot"

        godot --headless --path "$project_dir" --import

        log="$RUNNER_TEMP/addon-load-gate.log"
        godot_status=0
        godot --headless --path "$project_dir" --quit > "$log" 2>&1 || godot_status=$?
        cat "$log"

        if grep -q 'No GDExtension library found' "$log"; then
          echo "::error::the addon .gdextension resolved no library for linux.x86_64"
          exit 1
        fi
        if grep -Eq '(SCRIPT )?ERROR:' "$log"; then
          echo "::error::loading the SwiftGodot addon logged an error"
          exit 1
        fi
        if [ "$godot_status" -ne 0 ]; then
          echo "::error::Godot exited $godot_status while loading the SwiftGodot addon"
          exit 1
        fi

  android-scripts:
    name: Android script regression tests
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.android_scripts == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android build utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep

    - name: Install pinned Android NDK
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

    - name: Restore Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('Android/SwiftGodotPlugin/**/*.kts', 'Android/SwiftGodotPlugin/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Run Android script regression tests
      run: |
        scripts/test-android-portability
        scripts/test-stage-android-package
        scripts/test-build-android-libraries
        scripts/test-aggregate-android-jni
        scripts/test-validate-android-elf
        scripts/test-package-android-aar
        scripts/test-build-android-test-extension
        scripts/test-android-runtime-harness
        scripts/test-reclaim-android-build-space
        scripts/test-configure-android-emulator

  android-stage:
    name: Stage Android SwiftGodot package
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    # The Ubuntu runner image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    # Generation depends only on the Godot extension API and the generator, so a
    # hit skips a full host build of SwiftGodot.
    - name: Restore generated Swift sources
      uses: actions/cache@v4
      with:
        path: .build/android-generated-sources
        key: android-generated-sources-${{ runner.os }}-swift6.3.3-${{ hashFiles('Sources/ExtensionApi/**', 'Generator/**', 'Plugins/CodeGeneratorPlugin/**', 'Package.swift') }}

    # Binding generation is host-only and ABI independent, so every ABI job
    # reuses this one staged package instead of regenerating it.
    - name: Stage Android package
      env:
        SWIFT_GODOT_GENERATED_SOURCES_CACHE: ${{ github.workspace }}/.build/android-generated-sources
      run: scripts/generate-android-package .build/android-staged-package

    - name: Upload staged Android package
      uses: actions/upload-artifact@v4
      with:
        name: android-staged-package
        path: .build/android-staged-package
        if-no-files-found: error
        retention-days: 1

    # The macro plugin is a host binary shared by every ABI consumer build, so
    # caching it here avoids compiling swift-syntax in the ABI jobs.
    - name: Restore host macro plugin
      uses: actions/cache@v4
      with:
        path: .build/android-macro-plugin-cache
        key: android-macro-plugin-${{ runner.os }}-${{ runner.arch }}-swift6.3.3-${{ hashFiles('Package.resolved', 'Sources/SwiftGodotMacroLibrary/**') }}

    - name: Stage host macro plugin
      env:
        SWIFT_GODOT_ANDROID_MACRO_PLUGIN_CACHE: ${{ github.workspace }}/.build/android-macro-plugin-cache/SwiftGodotMacroLibrary-tool
      run: scripts/build-android-macro-plugin .build/android-macro-plugin/SwiftGodotMacroLibrary-tool

    - name: Upload host macro plugin
      uses: actions/upload-artifact@v4
      with:
        name: android-macro-plugin
        path: .build/android-macro-plugin/SwiftGodotMacroLibrary-tool
        if-no-files-found: error
        retention-days: 1

  android-abi:
    name: Android ${{ matrix.abi }} libraries
    needs: android-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]

    env:
      SWIFT_GODOT_ANDROID_ABIS: ${{ matrix.abi }}
      SWIFT_GODOT_ANDROID_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # The Ubuntu runner image does not ship the Swift release signing keys
    # that setup-swift needs to verify its Swiftly download.
    - name: Import Swift signing keys
      run: curl -fsSL --compressed https://swift.org/keys/all-keys.asc | gpg --import -

    - name: Set up Swift 6.3.3
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.3.3"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Restore Swift Android SDK archive cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/swift-android-sdk-cache
        key: swift-android-sdk-${{ env.SWIFT_ANDROID_SDK_SHA256 }}

    - name: Install pinned Android toolchain
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
        cache_dir="$RUNNER_TEMP/swift-android-sdk-cache"
        mkdir -p "$cache_dir"
        bundle_archive="$cache_dir/${SWIFT_ANDROID_SDK_URL##*/}"
        if [[ ! -f "$bundle_archive" ]]; then
          curl -fL --retry 3 --retry-all-errors -o "$bundle_archive" "$SWIFT_ANDROID_SDK_URL"
        fi
        echo "$SWIFT_ANDROID_SDK_SHA256  $bundle_archive" | sha256sum -c -
        swift sdk install "$bundle_archive"
        sdk_root=$(find "$HOME" -type d -path '*/swift-6.3.3-RELEASE_android.artifactbundle/swift-android' -print -quit)
        test -n "$sdk_root"
        echo "SWIFT_GODOT_ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
        ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724" "$sdk_root/scripts/setup-android-sdk.sh"

    - name: Download staged Android package
      uses: actions/download-artifact@v4
      with:
        name: android-staged-package
        path: .build/android-staged-package

    - name: Restore staged Android package mtimes
      run: scripts/restore-git-mtimes --staged-android-package .build/android-staged-package

    - name: Download host macro plugin
      uses: actions/download-artifact@v4
      with:
        name: android-macro-plugin
        path: .build/android-macro-plugin

    - name: Restore Android SwiftPM build cache
      id: build-cache
      uses: actions/cache/restore@v4
      with:
        path: .build/android-distribution/build/${{ matrix.abi }}
        key: swift-build-android-${{ matrix.abi }}-${{ env.SWIFT_GODOT_ANDROID_CONFIGURATION }}-swift6.3.3-${{ hashFiles('Package.android.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}
        restore-keys: |
          swift-build-android-${{ matrix.abi }}-${{ env.SWIFT_GODOT_ANDROID_CONFIGURATION }}-swift6.3.3-${{ hashFiles('Package.android.swift', 'Sources/ExtensionApi/extension_api.json') }}-

    - name: Build and validate ${{ matrix.abi }}
      env:
        SWIFT_GODOT_ANDROID_PACKAGE: ${{ github.workspace }}/.build/android-staged-package
        SWIFT_GODOT_ANDROID_MACRO_PLUGIN: ${{ github.workspace }}/.build/android-macro-plugin/SwiftGodotMacroLibrary-tool
      run: |
        chmod +x "$SWIFT_GODOT_ANDROID_MACRO_PLUGIN"
        scripts/build-android-libraries .build/android
        scripts/build-android-test-extension .build/android-test

    - name: Save Android SwiftPM build cache
      if: ${{ steps.build-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.build-cache.outputs.cache-matched-key == '') }}
      uses: actions/cache/save@v4
      with:
        path: .build/android-distribution/build/${{ matrix.abi }}
        key: swift-build-android-${{ matrix.abi }}-${{ env.SWIFT_GODOT_ANDROID_CONFIGURATION }}-swift6.3.3-${{ hashFiles('Package.android.swift', 'Sources/ExtensionApi/extension_api.json') }}-${{ github.sha }}

    # Each ABI uploads only its own subtree, so the aggregation job can detect
    # any file two ABI jobs both claim.
    - name: Collect ${{ matrix.abi }} artifacts
      run: |
        mkdir -p .build/android-upload
        cp -R .build/android/jni .build/android-upload/runtime-jni
        cp -R .build/android-test/jni .build/android-upload/consumer-jni

    - name: Upload ${{ matrix.abi }} artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-abi-${{ matrix.abi }}
        path: .build/android-upload
        if-no-files-found: error
        retention-days: 1

  android-package:
    name: Android AAR packaging and x86_64 runtime
    needs: android-abi
    # The emulator smoke test needs /dev/kvm, which the hosted Ubuntu image
    # exposes only on this runner size.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SWIFT_GODOT_ANDROID_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'debug' || 'release' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android build utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y ripgrep

    - name: Install pinned Android NDK
      run: |
        sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

    - name: Download per-ABI artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: android-abi-*
        path: .build/android-abis

    - name: Restore Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('Android/SwiftGodotPlugin/**/*.kts', 'Android/SwiftGodotPlugin/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Aggregate and validate both ABIs
      run: |
        scripts/aggregate-android-jni .build/android/jni .build/android-abis/*/runtime-jni
        scripts/aggregate-android-jni .build/android-test/jni .build/android-abis/*/consumer-jni
        scripts/validate-android-elf .build/android/jni

    - name: Package and validate Android AARs
      run: |
        scripts/package-android-aar .build/android/jni .build/android-aar
        scripts/package-android-test-aar .build/android-test/jni .build/android-test

    - name: Reclaim build space for Android emulator
      run: scripts/reclaim-android-build-space

    # Launch the emulator directly instead of through a third-party action. The
    # action booted a google_apis image on a pixel_6 profile and never reached
    # sys.boot_completed on this runner, and it captures no emulator log to
    # diagnose from.
    - name: Launch x86_64 emulator
      run: |
        test -c /dev/kvm
        sudo chmod 666 /dev/kvm
        sdkmanager "emulator" "system-images;android-35;default;x86_64"
        ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
        echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
        export ANDROID_AVD_HOME
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | avdmanager create avd --force --name test \
          --package "system-images;android-35;default;x86_64"
        # Bound the data partition, then let -wipe-data format it at boot.
        scripts/configure-android-emulator
        nohup "$ANDROID_HOME/emulator/emulator" \
          -avd test \
          -port 5554 \
          -no-window \
          -no-audio \
          -no-boot-anim \
          -no-snapshot \
          -wipe-data \
          -gpu swiftshader_indirect \
          > "$RUNNER_TEMP/swiftgodot-emulator.log" 2>&1 &

    - name: Wait for emulator boot
      run: |
        adb start-server
        attempt=1
        while [[ "$attempt" -le 180 ]]; do
          if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
            adb -s emulator-5554 devices -l
            exit 0
          fi
          sleep 2
          attempt=$((attempt + 1))
        done
        adb devices -l
        echo "--- emulator log ---" >&2
        tail -80 "$RUNNER_TEMP/swiftgodot-emulator.log" >&2
        exit 1

    - name: Run x86_64 Android emulator smoke test
      env:
        GH_TOKEN: ${{ github.token }}
        ANDROID_SERIAL: emulator-5554
      run: scripts/test-android-runtime x86_64

    # The exported APK is deliberately absent. It embeds the engine runtime
    # from the custom Android export templates, and artifacts on a public
    # repository are downloadable by anyone. The logs below are enough to
    # diagnose a failed smoke test.
    - name: Upload Android diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-diagnostics
        path: |
          .build/android-aar/SwiftGodot-release.aar
          .build/android-test/SwiftGodotAndroidTest-release.aar
          .build/android-runtime-x86_64/logcat.txt
          .build/android-runtime-x86_64/diagnostics/
          ${{ runner.temp }}/swiftgodot-emulator.log
        if-no-files-found: warn
        retention-days: 1

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - build-and-test-macos
      - macro-tests
      - release-script-tests
      - build-and-test-linux
      - android-scripts
      - android-stage
      - android-abi
      - android-package
    if: always()
    runs-on: ubuntu-24.04

    steps:
    - name: Verify all CI jobs succeeded or were skipped
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "Upstream job results: $RESULTS"
        if echo "$RESULTS" | jq -e 'any(. != "success" and . != "skipped")' >/dev/null; then
          echo "::error::One or more CI jobs failed or were cancelled"
          exit 1
        fi
