# This workflow will build a Swift project and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE_TAG: v4.7.2-20260826.1
  GODOT_EDITOR_SHA256: 6e9945ad00d7c6877f1c3a98224c17c5ff0caf8cf42b716e9152569f6b2ac71e

jobs:
  build-and-test-macos:
    runs-on: blacksmith-6vcpu-macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "latest-stable"

    - name: Install ripgrep
      run: brew install ripgrep

    - name: Install custom Godot
      env:
        GH_TOKEN: ${{ secrets.SWIFT_GODOT_RELEASE_TOKEN }}
      run: |
        test "$(uname -m)" = arm64
        if [[ -z "$GH_TOKEN" ]]; then
          echo "::error title=Missing secret::SWIFT_GODOT_RELEASE_TOKEN must have Contents read access to cafecito-games/custom-godot."
          exit 1
        fi

        archive="$RUNNER_TEMP/godot_macos_editor.arm64.zip"
        install_dir="$RUNNER_TEMP/custom-godot"
        bin_dir="$RUNNER_TEMP/custom-godot-bin"

        gh release download "$GODOT_RELEASE_TAG" \
          --repo cafecito-games/custom-godot \
          --pattern godot_macos_editor.arm64.zip \
          --dir "$RUNNER_TEMP"
        echo "$GODOT_EDITOR_SHA256  $archive" | shasum -a 256 --check

        mkdir -p "$install_dir" "$bin_dir"
        unzip -q "$archive" -d "$install_dir"
        ln -s "$install_dir/godot_macos_editor.app/Contents/MacOS/Godot" "$bin_dir/godot"
        echo "$bin_dir" >> "$GITHUB_PATH"

        export PATH="$bin_dir:$PATH"
        godot --version
        test "$(godot --version)" = "4.7.2.stable.cafecito_dc0a505af.ed1daf0bf"

    - name: Show ripgrep version
      run: |
        rg --version

    - name: Build
      run: swift build --build-tests --quiet

    - name: Run Swift tests (Swift Testing)
      run: swift test --skip-build --no-parallel --disable-xctest

    - name: Run Swift tests (XCTest)
      run: swift test --skip-build --no-parallel --disable-swift-testing

    - name: Run Godot-based tests
      run: swift run SwiftGodotTestRunner

    - name: Run release script regression tests
      run: |
        scripts/test-make-swiftgodot-framework
        scripts/test-release-build-configuration
        scripts/test-binary-manifest
        scripts/test-package-resolution
        scripts/test-distribution-package-staging
        scripts/test-package-godot-addon
        scripts/test-release-toolchain

    - name: Build macro artifact bundle (exercise release script)
      env:
        SWIFT_GODOT_INCLUDE_MACOS_X86: 1
      run: scripts/build-macro-artifactbundle "$RUNNER_TEMP/sg-macro-artifact" "0.0.0-ci"
